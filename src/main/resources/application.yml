server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api/v1}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:distrimarket-ms-featureC}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pos_db}?sslmode=require&prepareThreshold=${DB_PREPARE_THRESHOLD:0}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:false}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    disable-swagger-default-url: true

openapi:
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8080/api/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    name: ${LOG_FILE:logs/distrimarket-ms-featureC.log}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.distrimarket: ${LOG_LEVEL_APP:INFO}

pagination:
  default-page-size: ${PAGINATION_DEFAULT_PAGE_SIZE:10}
  max-page-size: ${PAGINATION_MAX_PAGE_SIZE:${PAGINATION_SEARCH_LIMIT:100}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
