server:
  port: 8082
  servlet:
    context-path: /ventas

spring:
  application:
    name: distrimarket-ventas
  devtools:
    restart:
      enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pos_db}?sslmode=${DB_SSL_MODE:require}&prepareThreshold=${DB_PREPARE_THRESHOLD:0}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  mvc:
    contentnegotiation:
      default-content-type: application/json

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${INVENTARIO_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${INVENTARIO_READ_TIMEOUT_MS:15000}

# Microservicio de inventario: se ubica por su nombre en Eureka
inventario:
  service-name: ${INVENTARIO_SERVICE_NAME:distrimarket-inventario}
  context-path: ${INVENTARIO_CONTEXT_PATH:/inventario}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    name: ${LOG_FILE:logs/distrimarket-ms-featureC.log}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.distrimarket: ${LOG_LEVEL_APP:INFO}
    com.distrimarket.ms.featurec.service: ${LOG_LEVEL_SERVICE:DEBUG}
    com.distrimarket.ms.featurec.repository: ${LOG_LEVEL_REPOSITORY:DEBUG}
    com.distrimarket.ms.featurec.logging.RepositoryLoggingAspect: ${LOG_LEVEL_REPOSITORY:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}

pagination:
  default-page: ${PAGINATION_DEFAULT_PAGE:0}
  default-page-size: ${PAGINATION_DEFAULT_PAGE_SIZE:10}
  max-page-size: ${PAGINATION_MAX_PAGE_SIZE:${PAGINATION_SEARCH_LIMIT:100}}
  one-indexed-parameters: ${PAGINATION_ONE_INDEXED:false}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    status-page-url-path: /ventas/actuator/info
    health-check-url-path: /ventas/actuator/health